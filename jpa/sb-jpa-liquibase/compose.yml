services:
  postgres:
    image: postgres:16-alpine
    container_name: neurowatch-db
    restart: always
    # Load environment variables from .env (create a local .env and add it to .gitignore)
    env_file:
      - .env
    environment:
      # Use variable substitution with optional defaults. Define sensitive values in .env
      POSTGRES_USER: ${POSTGRES_USER:-neurowatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neurowatch}
      # Set the system timezone for the container OS (use a sensible default)
      # Use IANA timezone names, e.g. Europe/Kyiv or Europe/Moscow
      TZ: ${TZ:-Europe/Kyiv}
      # Set the explicit timezone for PostgreSQL database engine (default to same TZ)
      PGTZ: ${PGTZ:-Europe/Kyiv}
    ports:
      - "5432:5432"
    volumes:
#      - neurowatch_db_data:/var/lib/postgresql/data
      - pgdata:/var/run/postgresql
    networks:
      - neurowatch_net

volumes:
  pgdata:

networks:
  neurowatch_net: