spring.application.name=spring-mail-sender

spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Replace with your email address
spring.mail.username=evad.se.dev@gmail.com
# Password moved to an environment variable for security.
# Set environment variable SPRING_MAIL_PASSWORD (see instructions below).
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.from=${SMTP_FROM:no-reply-teams@zakon-pro.ligazakon.net}

# Essential Security Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
