# Profile: dns-mx
# Per-recipient MX delivery: resolve recipient MX and deliver directly when possible.
# If MX lookup fails or direct delivery is undesired the configured fallback host will be used.

# Enable per-recipient MX delivery in application code
mail.useDns=true

# Fallback relay (used when MX lookup fails or as a fallback)
mail.dns.fallback-host=mail-00.ligazakon.net
mail.dns.fallback-port=25

# Ensure JavaMailSender (if used elsewhere) does not try to authenticate
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.from=no-reply@ligazakon.ua
