# Profile: dns-mx
# Per-recipient MX delivery: resolve recipient MX and deliver directly when possible.
# If MX lookup fails or direct delivery is undesired the configured fallback host will be used.

# Enable per-recipient MX delivery in application code
mail.useDns=true

# Fallback relay (used when MX lookup fails or as a fallback)
mail.dns.fallback-host=mail-00.ligazakon.net
mail.dns.fallback-port=25

# Ensure JavaMailSender (if used elsewhere) does not try to authenticate
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.from=${SMTP_FROM:no-reply-teams@zakon-pro.ligazakon.net}

# Optional envelope-from (MAIL FROM) used by direct delivery; if empty, application will use spring.mail.username
# mail.dns.envelope-from=no-reply@your-domain.example

# Connection timeouts
mail.dns.connectiontimeout=10000
mail.dns.timeout=10000
mail.dns.writetimeout=10000

